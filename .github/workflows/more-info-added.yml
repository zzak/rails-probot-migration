name: "rails-bot: Clear more-info-needed label"

on:
  issue_comment:
    types: [created]

jobs:
  unstale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - name: Get issue author
      id: issue
      uses: actions/github-script@v7
      with:
        script: |
          const issue = await github.rest.issues.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });
          return issue.data.user.login;
    - name: Check for stale label
      id: check_stale_label
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const labels = context.payload.issue.labels;
          const hasStaleLabel = labels.some(label => label.name === 'more-information-needed');
          core.setOutput('hasStaleLabel', hasStaleLabel);
    - name: Remove stale label if present
      if: steps.check_stale_label.outputs.hasStaleLabel == 'true' && steps.issue.outputs.login == context.actor
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const issueNumber = context.payload.issue.number;
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          await github.rest.issues.removeLabel({
            owner: owner,
            repo: repo,
            issue_number: issueNumber,
            name: 'more-information-needed'
          });
